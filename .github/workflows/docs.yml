# Build the docs site and deploy it to GitHub Pages.
#
# A fresh clone carries NO docs media (docs/img/, _static/figs, the mp4s
# are gitignored build output) and the pages reference those files with
# ``.. figure::`` / raw <video> embeds, so "build the docs" here is the
# CANONICAL media pipeline (make -C docs media with both opt-in legs):
# the scripted figs, the NASA answer-key art (MEDIA_NASA=1), the uisim
# screenshots for all three panels, the annotations, the device
# composites and the films (MEDIA_VIDEOS=1). The perf figs parse the
# live build trees (build/config, build/esp-idf/, build/moon-phase.bin,
# the root + knob managed_components/), so the P4 and knob device
# builds and the S3 build (LAST — the root managed_components/ holds
# only the last-resolved target's set, and gen_perf_bus reads the S3
# panel driver from it) run first; after the builds the job verifies
# the vendor headers the two vendor-leg figs parse (the S3 co5300 +
# pcf85063a AND the P4-only gt911) are all present and re-resolves the
# target that fetches any missing one.
#
# The site deploys from the GitHub Pages artifact (no gh-pages branch):
# the deploy job consumes the artifact the build job uploads. On a fresh
# repo, set repo Settings → Pages → Source = "GitHub Actions" once.
name: docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # the three hero webp (docs/_static/photos/sim_home.webp is the
          # committed README exception; docs/tools/waveshare-*-hero.webp
          # feed the device composites) are LFS pointers in the tree.
          lfs: true
      - name: System tools (graphviz dot, ImageMagick for the --refs crops, ffmpeg for the films)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz imagemagick ffmpeg
      # 3.14: the local venvs (docs, host_sim, the moon pipeline) are
      # 3.14, so the pinned requirements are proven to install on it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Docs venv (the site + the figs scripts run in it)
        run: |
          python3 -m venv docs/.venv
          docs/.venv/bin/pip install -q -r docs/requirements.txt
      - name: Host-sim venv (the gate + NASA legs run in it)
        run: |
          python3 -m venv host_sim/.venv
          host_sim/.venv/bin/pip install -q -r assets/images/moon/requirements.txt
      - name: Moon assets (the committed NASA ground truth + the gate refs + the docs foundry faces, then the bake of all three boards)
        # The SVS 4720 kit (LFS) + the 36 SVS 5415 gate/quarter frames
        # + mooninfo_2025.json ship with the repo (static, sha256-pinned,
        # public domain) — no NASA fetch. --refs re-verifies the frames
        # and crops the MEDIA_NASA leg's answer key (final_400x400/);
        # --fonts the four foundry faces gen_perf_glyphs.py refuses to
        # run without. Bootstraps its own assets/images/moon/.venv.
        run: python3 assets/images/moon/get_assets.py --refs --fonts
      - name: Cache the ESP-IDF toolchain (~1.5 GB)
        uses: actions/cache@v4
        with:
          path: |
            /opt/esp-idf
            /home/runner/.espressif
          key: esp-idf-v5.5.1-{{ runner.os }}
      # The repo's own documented bootstrap (README: clone esp-idf,
      # checkout v5.5.1, install.sh) — there is no official setup action
      # to pin against, so the toolchain is installed by the tree the
      # firmware is built with, and cached.
      - name: ESP-IDF 5.5.1 (esp32s3 + esp32p4 toolchains)
        run: |
          if [ ! -d /opt/esp-idf ]; then
            git clone --depth 1 --branch v5.5.1 \
              https://github.com/espressif/esp-idf.git /opt/esp-idf
            yes | /opt/esp-idf/install.sh esp32s3 esp32p4
          fi
          echo "IDF_PATH=/opt/esp-idf" >> "$GITHUB_ENV"
      # The three device build trees (build/ incl. build/p4, plus the knob's
      # tree) + the resolved vendor components + the two gitignored P4/knob
      # dependency locks. KEYED ON THE FIRMWARE CONTENT: a hit means every
      # input the builds consume is byte-identical to the run that saved
      # the tree, so the .bin + sdkconfig.h + vendor headers the perf figs
      # parse are already current and the device builds are SKIPPED
      # (runners are ephemeral — a restored tree would not be a reliable
      # ninja-incremental build, since the fresh checkout resets source
      # mtimes; skipping is what makes a non-firmware push fast). The
      # knob build dir sits ABOVE the checkout (../build/knob — the
      # documented idf.py -C knob -B ../build/knob), hence the absolute
      # path. A canary step verifies the artifacts exist after a skip.
      - name: Cache the device build trees + resolved components
        id: devbuilds
        uses: actions/cache@v4
        with:
          path: |
            build
            /home/runner/work/moon-clock-esp/build/knob
            managed_components
            knob/managed_components
            dependencies.lock.p4
            knob/dependencies.lock.knob
          key: idf551-devbuilds-${{ runner.os }}-${{ hashFiles('dependencies.lock', 'main/**', 'components/**', 'knob/**', 'CMakeLists.txt', 'knob/CMakeLists.txt', 'sdkconfig.defaults*', 'knob/sdkconfig.defaults*') }}
      - name: Device builds (the figs' inputs)
        if: steps.devbuilds.outputs.cache-hit != 'true'
        # P4 + knob FIRST, S3 LAST: the root managed_components/ keeps
        # only the last-resolved target's set, and gen_perf_bus.py reads
        # the S3 panel driver (espressif__esp_lcd_co5300) from it. The
        # knob BUILD (the documented -B ../build/knob — the knob build
        # dir sits ABOVE the repo) populates ../build/knob/config/
        # sdkconfig.h (gen_perf_fresh/locks/sched/silicon/response read
        # it) and knob/managed_components/ (gen_perf_bus reads the SH8601
        # driver from it) — and emits ../build/knob/knob.bin, whose size
        # gen_perf_storage.py measures (a reconfigure alone leaves no
        # binary). The knob is its own IDF project (own lock, own
        # managed_components), so its build never prunes the root set.
        # The two vendor-leg figs (perf_bus, perf_silicon) parse the live
        # vendor headers from the SAME root managed_components/ but need
        # packages from DIFFERENT targets: gen_perf_bus the S3-only panel
        # driver (co5300) and gen_perf_silicon the P4-only touch driver
        # (gt911) — pcf85063a + lvgl are in both. A single target's lock
        # never provides both (the component manager prunes to its own
        # lock on every re-resolve), so the S3 build last leaves the S3
        # set; the union is then made by stashing the P4-only gt911
        # through a P4 reconfigure and copying it back over the S3 set
        # (the Media step runs no idf.py, so the copied package survives
        # to figure time).
        run: |
          source "$IDF_PATH/export.sh"
          idf.py -D IDF_TARGET=esp32p4 -B build/p4 -D SDKCONFIG=sdkconfig.p4 build
          idf.py -C knob -B ../build/knob build
          idf.py build
          # Base the union on the S3 set (the S3 binary's co5300 driver +
          # pcf85063a must be present for gen_perf_bus):
          if [ ! -d managed_components/espressif__esp_lcd_co5300 ] \
             || [ ! -d managed_components/waveshare__pcf85063a ]; then
            idf.py reconfigure
          fi
          # Add the P4-only touch driver (gt911) gen_perf_silicon parses.
          # The P4 reconfigure prunes the S3 co5300, so: fetch gt911, stash
          # it, restore the S3 set, then copy gt911 back (see the step note):
          if [ ! -d managed_components/espressif__esp_lcd_touch_gt911 ]; then
            idf.py -D IDF_TARGET=esp32p4 -B build/p4 -D SDKCONFIG=sdkconfig.p4 reconfigure
            cp -a managed_components/espressif__esp_lcd_touch_gt911 \
              build/p4/.gt911-fig-stash
            idf.py reconfigure
            rm -rf managed_components/espressif__esp_lcd_touch_gt911
            cp -a build/p4/.gt911-fig-stash \
              managed_components/espressif__esp_lcd_touch_gt911
          fi
      - name: Device-build canary (the figs' inputs exist)
        # Runs on BOTH paths (fresh build, or the builds skipped on a
        # content-key cache hit): the Media step and the perf figs parse
        # exactly these files, so their absence is a hard failure either
        # way. A failure here on a cache hit means the key's input globs
        # are stale — add the missing path to the hashFiles list.
        run: |
          for f in build/moon-phase.bin build/p4/moon-phase.bin \
                   ../build/knob/knob.bin \
                   build/config/sdkconfig.h build/p4/config/sdkconfig.h \
                   ../build/knob/config/sdkconfig.h \
                   managed_components/espressif__esp_lcd_co5300 \
                   managed_components/espressif__esp_lcd_touch_gt911 \
                   managed_components/waveshare__pcf85063a \
                   knob/managed_components/espressif__esp_lcd_sh8601; do
            if [ ! -e "$f" ]; then
              echo "missing $f (device builds $([ "$CACHE_HIT" = true ] && echo 'were skipped on a cache hit' || echo 'ran')); the tree is incomplete"
              exit 1
            fi
          done
        env:
          CACHE_HIT: ${{ steps.devbuilds.outputs.cache-hit }}
      - name: "Host simulators (one moon_sim per board: the movie bake + the gate's C-runtime frames)"
        # host_sim is a standalone CMake project (no ESP-IDF) that reads the
        # get_assets bake outputs; SIM_BUILD_DIRS maps s3 -> host_sim/build,
        # p4 -> host_sim/build-p4, knob -> host_sim/build-knob, and both
        # moon.movie and check_gate refuse to run without the per-target
        # binary (each is configured with its board's MOON_ASSETS_TARGET).
        run: |
          cmake -DMOON_ASSETS_TARGET=s3    -B host_sim/build      -S host_sim
          cmake --build host_sim/build      -j"$(nproc)"
          cmake -DMOON_ASSETS_TARGET=p4    -B host_sim/build-p4   -S host_sim
          cmake --build host_sim/build-p4   -j"$(nproc)"
          cmake -DMOON_ASSETS_TARGET=knob  -B host_sim/build-knob -S host_sim
          cmake --build host_sim/build-knob -j"$(nproc)"
      - name: Movie bake (the moon-movie manifests the perf figs read)
        # -m moon.movie bakes out/<t>/moon_movie.bin + its manifest for
        # all three boards, driving each board's moon_sim — gen_perf_boot /
        # gen_perf_storage / gen_perf_movie read those manifests (the asset
        # step bakes moon.assets only; the device builds tolerate the
        # movie's absence, the figs do not). The moon package lives in
        # assets/images/moon/, so it runs from there (like the get_assets
        # bake leg).
        run: cd assets/images/moon && .venv/bin/python -m moon.movie --target s3 p4 knob
      - name: "Media (the canonical regen: figs + NASA art + uisim x3 + annotations + composites + films)"
        env:
          MEDIA_NASA: "1" # docs/img/nasa/: five .. figure:: refs
          MEDIA_VIDEOS: "1" # the index + animations raw <video> embeds
        run: docs/.venv/bin/sphinx-build -b media docs docs/_build/media
      - name: HTML (0 warnings is the gate)
        run: docs/.venv/bin/sphinx-build -W -b html docs docs/_build/html
      - name: Docs drift gate (single-sourced fragments vs the sources)
        run: docs/.venv/bin/python docs/tools/check_docs_drift.py
      - name: Upload the built site (browse it on the run's Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/_build/html
          retention-days: 14
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
