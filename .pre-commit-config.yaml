repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        args: [--style=file]
        files: \.(c|cc|cpp|cxx|h|hpp)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # Use the ref you want to point at
    hooks:
      - id: check-yaml
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types: [markdown]
  # Commit-message guard (a pre-commit hook cannot see the message —
  # stages: [commit-msg] is the only stage that does). Installed with
  # `pre-commit install -t commit-msg` (commit-msg stage only; the
  # pre-commit stage is a separate deliberate decision).
  - repo: local
    hooks:
      - id: no-co-authored
        name: forbid Co-Authored commit messages
        entry: .githooks/commit-msg
        language: script
        stages: [commit-msg]
