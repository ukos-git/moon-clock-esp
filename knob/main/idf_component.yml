## IDF Component Manager Manifest File — knob firmware
##
## The LVGL 9.6 family matches the clock project (lvgl/lvgl ^9). The panel
## driver is the registry component the vendor demo itself uses; the LVGL
## port is hand-rolled in knob_board (no esp_lvgl_port dependency — the
## flush path stays under project control, the clock's house style).
## (The companion era's espressif/mdns went with the companion approach,
## 2026-11-08.)
##
## P0 family seam: the shared components/clock reaches these through the
## knob's board shim (clock.c's "pcf85063a.h" include and the
## esp_io_expander REQUIRES arrive the way they do on the clock boards —
## the shim's public deps). Versions pinned to the clock lock's resolved
## entries so both projects carry identical driver trees.
dependencies:
  idf:
    version: '>=5.4'
  lvgl/lvgl: ^9
  espressif/esp_lcd_sh8601: ^2
  espressif/esp_io_expander: 1.2.1
  waveshare/pcf85063a: 1.1.0
